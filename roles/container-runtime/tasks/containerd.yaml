- name: Install containerd (Debian/Ubuntu)
  when: ansible_facts.os_family == "Debian"
  block:
  - name: Update apt repositories
    ansible.builtin.apt:
      update_cache: true

  - name: Make sure the gpg package is installed
    ansible.builtin.apt:
      name:
      - gpg
      state: present

  - name: Create keyring directory
    ansible.builtin.file:
      group: root
      mode: '0755'
      owner: root
      path: /etc/apt/keyrings
      state: directory

  - name: Download GPG keyring
    ansible.builtin.get_url:
      dest: /etc/apt/keyrings/docker
      group: root
      mode: '0644'
      owner: root
      url: "{{ kubernetes_containerd_mirror_gpgkey }}"

  - name: Dearmor gpg keyring
    ansible.builtin.command:
      cmd: gpg --batch --yes --dearmor /etc/apt/keyrings/docker
      creates: /etc/apt/keyrings/docker.gpg

  - name: Set GPG keyring permissions
    ansible.builtin.file:
      group: root
      mode: '0644'
      owner: root
      path: /etc/apt/keyrings/docker.gpg
      state: file

  - name: Remove old Docker apt repository list file
    ansible.builtin.file:
      path: /etc/apt/sources.list.d/docker.list
      state: absent

  - name: Remove old Docker apt repository sources file
    ansible.builtin.file:
      path: /etc/apt/sources.list.d/Docker.sources
      state: absent

  - name: Add apt repository
    ansible.builtin.deb822_repository:
      components: ["stable"]
      install_python_debian: true
      name: Docker
      signed_by: /etc/apt/keyrings/docker.gpg
      suites: ["{{ ansible_facts[\"distribution_release\"] | lower }}"]
      uris: ["{{ kubernetes_containerd_mirror }}"]

  - name: Resolve containerd package version (Debian/Ubuntu)
    ansible.builtin.include_tasks:
      file: containerd-resolve-version-debian.yaml

  - name: Install containerd
    ansible.builtin.apt:
      name:
      - "{{ 'containerd.io' if containerd_version == 'latest' else 'containerd.io=' + containerd_version }}"
      state: present
      allow_downgrade: true
      update_cache: true

  - name: Hold containerd.io
    ansible.builtin.dpkg_selections:
      name: containerd.io
      selection: hold

- name: Install containerd (RedHat/Rocky/Alma/Fedora)
  when: ansible_facts.os_family == "RedHat"
  block:
  - name: Add Docker CE repository
    ansible.builtin.yum_repository:
      baseurl: "{{ kubernetes_containerd_mirror }}"
      description: Docker CE Stable - $basearch
      enabled: true
      gpgcheck: true
      gpgkey: "{{ kubernetes_containerd_mirror_gpgkey }}"
      name: docker-ce-stable

  - name: Install versionlock plugin
    ansible.builtin.dnf:
      name: python3-dnf-plugin-versionlock
      state: present

  - name: Resolve containerd package version (RedHat)
    ansible.builtin.include_tasks:
      file: containerd-resolve-version-redhat.yaml

  - name: Install containerd
    ansible.builtin.dnf:
      name: "{{ 'containerd.io' if containerd_version == 'latest' else 'containerd.io-' + containerd_version }}"
      state: present
      allow_downgrade: true

  - name: Hold containerd.io
    changed_when: true
    ansible.builtin.command:
      cmd: dnf versionlock add containerd.io

- name: Configure containerd
  ansible.builtin.include_tasks:
    file: containerd-configure.yaml
